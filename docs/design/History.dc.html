<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VibeMap - Scan History</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
  body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#faf9fd;color:#1a1b1e}
  *{box-sizing:border-box}
  .vm-btn{border:none;cursor:pointer;font-family:inherit}
  .hist-row:hover{border-color:#2e5ce6 !important}
</style>
</helmet>

<div style="min-height:100vh;width:100%;display:flex;flex-direction:column">

  <header style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:20px 32px;border-bottom:1px solid #efedf1;background:#ffffff">
    <div style="display:flex;align-items:center;gap:10px">
      <div style="width:28px;height:28px;border-radius:8px;background:#2e5ce6"></div>
      <span style="font-weight:700;font-size:18px">VibeMap</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <span title="Scan History (current)" style="width:34px;height:34px;border-radius:9px;background:#0041ca;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.4)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
      </span>
      <a href="ProviderSetting.dc.html" title="AI Settings" style="width:34px;height:34px;border-radius:9px;background:#2e5ce6;display:flex;align-items:center;justify-content:center;text-decoration:none">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>
      </a>
    </div>
  </header>

  <main style="flex:1;display:flex;justify-content:center;padding:40px 32px">
    <div style="width:100%;max-width:640px;display:flex;flex-direction:column;gap:16px">

      <div>
        <h1 style="margin:0 0 4px;font-size:20px;font-weight:700">Folders you've scanned before</h1>
        <p style="margin:0;font-size:13px;color:#434655;line-height:20px">Open a past result instantly, or rescan to catch up on new changes. Stored only on this computer.</p>
      </div>

      <sc-for list="{{items}}" as="h" hint-placeholder-count="3">
        <div class="hist-row" style="display:flex;align-items:center;gap:14px;padding:16px;border-radius:12px;border:1px solid #efedf1;background:#ffffff">
          <span style="width:36px;height:36px;border-radius:10px;background:#dce1ff;display:flex;align-items:center;justify-content:center;flex-shrink:0">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2e5ce6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
          </span>
          <div style="display:flex;flex-direction:column;gap:2px;min-width:0;flex:1">
            <span style="font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{h.folderName}}</span>
            <span style="font-size:12px;color:#747686;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{h.folderPath}}</span>
          </div>
          <span style="font-size:11px;color:#9196a8;flex-shrink:0;white-space:nowrap">{{h.lastScannedLabel}}</span>
          <button class="vm-btn" style="padding:8px 14px;border-radius:8px;background:#f2f2f6;color:#434655;font-size:12px;font-weight:600;flex-shrink:0">Rescan</button>
          <button class="vm-btn" style="padding:8px 14px;border-radius:8px;background:#2e5ce6;color:#ffffff;font-size:12px;font-weight:600;flex-shrink:0">Open</button>
        </div>
      </sc-for>

      <sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
        <div style="text-align:center;padding:40px 20px;color:#747686;font-size:13px">No scans yet. Pick a folder to get started.</div>
      </sc-if>

      <a href="PickFolder.dc.html" style="text-align:center;margin-top:8px;font-size:13px;color:#747686;text-decoration:none">Back to Pick Folder</a>
    </div>
  </main>

</div>
</x-dc>

<script type="text/x-dc" data-dc-script data-props='{"items":{"editor":null},"empty":{"editor":"bool","default":false}}'>
class Component extends DCLogic {
  renderVals() {
    const defaultItems = [
      { folderName: 'vibemap-project', folderPath: 'C:\\Users\\A\\Downloads\\vibemap-project', lastScannedLabel: '2 hours ago' },
      { folderName: 'client-dashboard', folderPath: 'C:\\Users\\A\\Projects\\client-dashboard', lastScannedLabel: 'Yesterday' },
      { folderName: 'old-portfolio-site', folderPath: 'D:\\Archive\\old-portfolio-site', lastScannedLabel: '12 days ago' }
    ];
    return {
      items: this.props.items ?? defaultItems,
      empty: this.props.empty ?? false
    };
  }
}
</script>
</body>
</html>
