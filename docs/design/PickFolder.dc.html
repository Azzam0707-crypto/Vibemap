<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VibeMap - Pick Folder</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<style>
  body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#faf9fd;color:#1a1b1e}
  *{box-sizing:border-box}
  .pick-btn{border:none;cursor:pointer;font-family:inherit}
</style>
</helmet>

<div style="min-height:100vh;width:100%;display:flex;flex-direction:column">

  <header style="display:flex;align-items:center;gap:10px;padding:20px 32px;border-bottom:1px solid #efedf1;background:#ffffff">
    <div style="width:28px;height:28px;border-radius:8px;background:#2e5ce6"></div>
    <span style="font-weight:700;font-size:18px">VibeMap</span>
  </header>

  <main style="flex:1;display:flex;align-items:center;justify-content:center;padding:32px">
    <div style="display:flex;flex-direction:column;align-items:center;gap:20px;max-width:440px;text-align:center">

      <div style="width:64px;height:64px;border-radius:16px;background:#dce1ff;display:flex;align-items:center;justify-content:center">
        <div style="width:28px;height:22px;border:2px solid #2e5ce6;border-radius:4px;position:relative">
          <div style="position:absolute;top:-6px;left:2px;width:12px;height:6px;background:#dce1ff;border:2px solid #2e5ce6;border-bottom:none;border-radius:3px 3px 0 0"></div>
        </div>
      </div>

      <h1 style="margin:0;font-size:22px;font-weight:700">Which project do you want to see?</h1>
      <p style="margin:0;font-size:14px;color:#434655;line-height:21px">Pick your project folder, and VibeMap will read through it and explain what's inside in plain language.</p>

      <a href="Scanning.dc.html" style="text-decoration:none"><button class="pick-btn" style="margin-top:8px;padding:12px 28px;border-radius:10px;background:#2e5ce6;color:#ffffff;font-size:14px;font-weight:600">Pick a project folder</button></a>

      <a href="ProviderSetting.dc.html" style="font-size:13px;color:#747686;text-decoration:none;border-bottom:1px solid #d8dbe4">Set up AI first (optional)</a>
    </div>
  </main>

  <footer style="padding:14px 32px 28px;text-align:center">
    <span style="font-size:12px;color:#747686">Everything runs on your own computer.</span>
  </footer>

</div>
</x-dc>

<script type="text/x-dc" data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
