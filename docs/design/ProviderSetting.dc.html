<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VibeMap - AI Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<style>
  body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#faf9fd;color:#1a1b1e}
  *{box-sizing:border-box}
  input{font-family:inherit}
</style>
</helmet>

<div style="min-height:100vh;width:100%;display:flex;flex-direction:column">

  <header style="display:flex;align-items:center;gap:10px;padding:20px 32px;border-bottom:1px solid #efedf1;background:#ffffff">
    <div style="width:28px;height:28px;border-radius:8px;background:#2e5ce6"></div>
    <span style="font-weight:700;font-size:18px">VibeMap</span>
    <span style="margin-left:auto;font-size:13px;color:#434655">AI Settings</span>
  </header>

  <main style="flex:1;display:flex;justify-content:center;padding:48px 32px">
    <div style="width:100%;max-width:480px;display:flex;flex-direction:column;gap:20px">

      <div>
        <h1 style="margin:0 0 4px;font-size:20px;font-weight:700">Which AI do you want to use?</h1>
        <p style="margin:0;font-size:13px;color:#434655;line-height:20px">This is what reads your project and writes the summaries.</p>
      </div>

      <sc-for list="{{providers}}" as="p" hint-placeholder-count="2">
        <label style="display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:12px;border:1.5px solid {{p.border}};background:{{p.bg}};cursor:pointer">
          <span style="width:18px;height:18px;border-radius:999px;border:2px solid {{p.dot}};flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center">
            <sc-if value="{{p.selected}}" hint-placeholder-val="{{true}}">
              <span style="width:9px;height:9px;border-radius:999px;background:{{p.dot}}"></span>
            </sc-if>
          </span>
          <span style="display:flex;flex-direction:column;gap:3px">
            <span style="font-size:14px;font-weight:600">{{p.title}}</span>
            <span style="font-size:13px;color:#434655;line-height:19px">{{p.desc}}</span>
          </span>
        </label>
      </sc-for>

      <div style="display:flex;flex-direction:column;gap:6px">
        <span style="font-size:13px;font-weight:500">Provider endpoint</span>
        <input type="text" placeholder="api.anthropic.com, api.openai.com, or another compatible provider" style="padding:11px 14px;border-radius:8px;border:1px solid #d8dbe4;font-size:14px;outline:none">
        <span style="font-size:12px;color:#747686">Use whichever provider you prefer, as long as it fits the project's format.</span>
      </div>

      <div style="display:flex;flex-direction:column;gap:6px">
        <span style="font-size:13px;font-weight:500">API key</span>
        <input type="password" placeholder="sk-..." style="padding:11px 14px;border-radius:8px;border:1px solid #d8dbe4;font-size:14px;outline:none">
        <span style="font-size:12px;color:#747686">Stored locally on your computer only.</span>
      </div>

      <button style="margin-top:4px;padding:12px;border:none;border-radius:10px;background:#2e5ce6;color:#ffffff;font-size:14px;font-weight:600;cursor:pointer">Save</button>
      <a href="PickFolder.dc.html" style="text-align:center;font-size:13px;color:#747686;text-decoration:none">Skip, set this up later</a>

    </div>
  </main>

</div>
</x-dc>

<script type="text/x-dc" data-dc-script data-props='{"providers":{"editor":null}}'>
class Component extends DCLogic {
  renderVals() {
    const defaultProviders = [
      { title: 'Cloud API (your choice)', desc: 'Claude, OpenAI, or another provider, as long as it fits the project.', border: '#2e5ce6', bg: '#fbfcff', dot: '#2e5ce6', selected: true },
      { title: 'Ollama (local)', desc: 'Runs on your own machine, free, needs installing first.', border: '#efedf1', bg: '#ffffff', dot: '#c9ccd6', selected: false }
    ];
    return { providers: this.props.providers ?? defaultProviders };
  }
}
</script>
</body>
</html>
